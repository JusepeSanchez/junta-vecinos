{% extends "base.html" %}
{% block title %}Confirmar eliminación{% endblock %}
{% block content %}
<section class="card"><h1>Confirmar eliminación</h1>
    <p>¿Eliminar «{{ objeto }}»?</p>
    <form method="post">{% csrf_token %}
        <button class="danger" type="submit">Sí, eliminar</button>
        <a class="button secondary" href="{% url volver %}">Cancelar</a>
    </form>
</section>
{% endblock %}
